<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单卡旅行助手 · 五阶段状态机 Demo</title>
<style>
  :root{
    --card-bg:#FFFFFF; --card-text:#1A1A1A; --card-sub:#8A8A8A; --card-line:#F0F0F0;
    --page-bg:#F5F6FA; --panel-bg:#FFFFFF; --panel-text:#1A1A1A; --panel-sub:#6B6B6B;
    --accent:#0A59F7; --wall1:#DCE7FF; --wall2:#ECE3FF; --wall3:#E6F4FF;
    --s1:#0A59F7; --s2:#0A84FF; --s3:#34C759; --s3b:#FF9500; --s4:#FF6B35; --s5:#BF5AF2;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--page-bg);color:var(--panel-text);padding:20px;display:flex;
    justify-content:center;gap:32px;align-items:flex-start;flex-wrap:wrap;min-height:100vh}
  /* ====== 控制台 ====== */
  .console{width:340px;background:var(--panel-bg);border-radius:20px;padding:22px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);position:sticky;top:20px;flex-shrink:0}
  .console h1{font-size:20px;font-weight:700}
  .console .sub{font-size:12px;color:var(--panel-sub);margin-top:4px;line-height:1.5}
  .trip-card{background:linear-gradient(135deg,#0A59F7,#8A5CF6);color:#fff;border-radius:14px;
    padding:14px 16px;margin-top:14px;line-height:1.5}
  .trip-card .t1{font-size:15px;font-weight:700}
  .trip-card .t2{font-size:11px;opacity:.92;margin-top:3px}
  .seg-label{font-size:12px;color:var(--panel-sub);margin:16px 0 8px;font-weight:600;
    display:flex;align-items:center;gap:6px}
  .seg-label .signal{font-size:10px;background:#E8F5E9;color:#2E7D32;padding:2px 7px;
    border-radius:10px;font-weight:500;margin-left:auto}
  .btn-group{display:flex;flex-wrap:wrap;gap:8px}
  .btn-group button{border:1px solid var(--card-line);background:transparent;color:var(--panel-text);
    padding:9px 14px;border-radius:12px;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit;
    outline:none;font-weight:500}
  .btn-group button:hover{border-color:var(--accent);color:var(--accent)}
  .btn-group button.on,.btn-group button.on:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .stage-info{background:var(--card-line);border-radius:12px;padding:12px 14px;font-size:12px;
    color:var(--panel-sub);line-height:1.7;margin-top:10px}
  .stage-info b{color:var(--panel-text)}
  .stage-info .si-signal{color:var(--accent);font-weight:600}
  .notes{margin-top:16px;font-size:11px;color:var(--panel-sub);line-height:1.8;
    border-top:1px dashed var(--card-line);padding-top:12px}
  .notes .ni{padding:2px 0}
  .notes b{color:var(--panel-text)}
  /* ====== 手机 ====== */
  .phone{width:384px;height:832px;background:#1c1c1e;border-radius:46px;padding:11px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);position:relative;flex-shrink:0}
  .screen{width:362px;height:810px;border-radius:36px;overflow:hidden;position:relative;
    background:linear-gradient(165deg,var(--wall1),var(--wall2) 55%,var(--wall3));
    display:flex;flex-direction:column}
  .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:10px;height:10px;
    border-radius:50%;background:#000;z-index:30}
  .statusbar{height:40px;display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;font-size:14px;font-weight:600;color:#1a1a1a;z-index:20;flex-shrink:0}
  .statusbar .right{display:flex;align-items:center;gap:6px;font-size:12px}
  /* ====== 桌面网格 ====== */
  .desktop{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(7,1fr);
    gap:8px;padding:4px 12px 0;overflow:hidden;align-content:start}
  /* app 图标 */
  .app-icon{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
  .app-icon .ico{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;
    justify-content:center;font-size:24px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .app-icon .name{font-size:9px;color:#1a1a1a;font-weight:500;text-shadow:0 1px 2px rgba(255,255,255,.5);max-width:70px;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  /* ====== 单卡 4×2（横向） ====== */
  .travel-card{grid-column:1/span 4;grid-row:1/span 2;border-radius:20px;overflow:hidden;
    position:relative;box-shadow:0 6px 20px rgba(0,0,0,.15);
    transition:opacity .35s,transform .35s;animation:cardIn .4s ease;
    display:flex;flex-direction:column;cursor:pointer}
  @keyframes cardIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
  .travel-card.fade-out{opacity:0;transform:scale(.96)}
  .tc-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
  .tc-bg::after{content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.28) 40%,rgba(0,0,0,.5) 100%)}
  /* 进度条 */
  .tc-progress{display:flex;gap:2px;padding:4px 10px 0;position:relative;z-index:2;flex-shrink:0}
  .tc-progress .seg{flex:1;height:2px;border-radius:1px;background:rgba(255,255,255,.2);transition:.3s}
  .tc-progress .seg.done{background:rgba(255,255,255,.5)}
  .tc-progress .seg.cur{background:#fff;box-shadow:0 0 4px rgba(255,255,255,.6)}
  /* Header */
  .tc-header{position:relative;z-index:2;display:flex;align-items:center;gap:5px;
    padding:3px 10px 1px;flex-shrink:0}
  .tc-app-ico{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;
    justify-content:center;font-size:12px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.2)}
  .tc-app-name{font-size:10px;font-weight:600;color:#fff;flex:1;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .tc-stage-badge{font-size:8px;font-weight:600;color:#fff;background:rgba(255,255,255,.22);
    backdrop-filter:blur(6px);padding:2px 7px;border-radius:16px;flex-shrink:0}
  .tc-pull{width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.22);
    backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#fff;cursor:pointer;flex-shrink:0;transition:.2s;border:none}
  .tc-pull:hover{background:rgba(255,255,255,.35)}
  /* Body - 整片毛玻璃信息面板 */
  .tc-body{position:relative;z-index:2;flex:1;padding:1px 10px 10px;display:flex;
    flex-direction:column;overflow:hidden}
  .tc-glass-panel{flex:1;background:rgba(0,0,0,.34);backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);border-radius:18px;
    border:1px solid rgba(255,255,255,.14);padding:8px 10px;display:flex;
    flex-direction:column;gap:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),
    0 6px 20px rgba(0,0,0,.15);overflow:hidden}
  /* 通用内容样式 */
  .tc-label{font-size:10px;color:rgba(255,255,255,.72);font-weight:500;letter-spacing:.2px}
  .tc-big{font-size:34px;font-weight:800;color:#fff;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.25)}
  .tc-big.sm{font-size:22px;line-height:1.1}
  .tc-text{font-size:11px;color:rgba(255,255,255,.88);line-height:1.4}
  .tc-text b{color:#fff;font-weight:600}
  .tc-row{display:flex;align-items:center;gap:6px;font-size:11px;color:#fff;flex-shrink:0}
  .tc-row .ico{font-size:14px;flex-shrink:0}
  .tc-row .val{font-weight:600}
  .tc-row .sub{font-size:10px;color:rgba(255,255,255,.7)}
  .tc-chips{display:flex;gap:5px;flex-wrap:wrap}
  .tc-chip{font-size:10px;background:rgba(255,255,255,.16);color:#fff;padding:4px 9px;
    border-radius:13px;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.08);
    cursor:pointer;transition:.15s;user-select:none}
  .tc-chip:hover{filter:brightness(1.15);transform:scale(1.03)}
  .tc-chip:active{transform:scale(.97)}
  .tc-chip.done{background:rgba(52,199,89,.32);border-color:rgba(52,199,89,.25)}
  .tc-chip.todo{background:rgba(255,159,10,.28);border-color:rgba(255,159,10,.2)}
  .tc-sep{width:1px;height:14px;background:rgba(255,255,255,.15);flex-shrink:0;margin:0 2px}
  /* 航班信息条 */
  .flight-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:3px 9px;font-size:11px;color:#fff}
  .flight-badge .plane{font-size:13px}
  /* 状态流时间线 */
  .tc-status-flow{display:flex;align-items:center;gap:3px;font-size:10px;color:rgba(255,255,255,.8);flex-wrap:wrap}
  .tc-status-flow .step{display:flex;align-items:center;gap:3px;white-space:nowrap}
  .tc-status-flow .step.done{color:rgba(255,255,255,.55)}
  .tc-status-flow .step.cur{color:#fff;font-weight:700}
  .tc-status-flow .step::after{content:'→';margin:0 2px;opacity:.35}
  .tc-status-flow .step:last-child::after{display:none}
  /* 分隔线 */
  .tc-divider{height:1px;background:rgba(255,255,255,.12);margin:2px 0;width:100%}
  /* 游览：目的地信息 */
  .spot-row{display:flex;align-items:center;gap:10px}
  .spot-thumb{width:48px;height:48px;border-radius:10px;background-size:cover;background-position:center;
    flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .spot-info{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .spot-info .spot-name{font-size:18px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spot-info .spot-meta{font-size:10px;color:rgba(255,255,255,.75)}
  /* 游览：当前景点（核心展示） */
  .cur-spot{display:flex;gap:8px;align-items:center;flex-shrink:0}
  .cur-thumb{width:44px;height:44px;border-radius:10px;background-size:cover;background-position:center;
    flex-shrink:0;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .cur-thumb .cur-play{position:absolute;left:3px;bottom:3px;font-size:7px;font-weight:600;
    color:#fff;background:rgba(10,89,247,.9);padding:1px 5px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .cur-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .cur-info .cur-name{font-size:17px;font-weight:800;color:#fff;line-height:1.1}
  .cur-info .cur-tags{display:flex;gap:3px;flex-wrap:wrap}
  .cur-info .cur-tags span{font-size:8px;background:rgba(255,255,255,.18);color:#fff;
    padding:1px 5px;border-radius:8px;backdrop-filter:blur(4px)}
  .cur-info .cur-meta{font-size:9px;color:rgba(255,255,255,.72)}
  /* 游览：下一站紧凑行 */
  .next-spot{display:flex;align-items:center;gap:6px;font-size:10px;color:#fff;flex-shrink:0;
    background:rgba(255,255,255,.08);border-radius:9px;padding:4px 8px;border:1px solid rgba(255,255,255,.1)}
  .next-spot .next-name{font-weight:700;font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .next-spot .next-meta{font-size:8px;color:rgba(255,255,255,.65)}
  /* 附近推荐横排（图片铺满 + 文字叠底） */
  .nearby-row{display:flex;gap:5px;height:38px;flex-shrink:0;overflow:hidden}
  .nb-card{flex:1;position:relative;border-radius:9px;cursor:pointer;transition:.15s;
    min-width:0;overflow:hidden;border:1px solid rgba(255,255,255,.12);height:38px}
  .nb-card:hover{transform:scale(1.03)}
  .nb-card .nb-img{position:absolute;inset:0;background-size:cover;background-position:center}
  .nb-card .nb-img::after{content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 25%,rgba(0,0,0,.72) 100%)}
  .nb-card .nb-info{position:absolute;left:0;right:0;bottom:0;padding:3px 5px;
    display:flex;flex-direction:column;gap:0;z-index:1}
  .nb-card .nb-name{font-size:9px;color:#fff;font-weight:600;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .nb-card .nb-dist{font-size:7px;color:rgba(255,255,255,.85)}
  /* 回忆照片横排 */
  .mem-row{display:flex;gap:4px;flex:1;min-height:0;overflow:hidden}
  .mem-row .mem-ph{flex:1;border-radius:8px;background-size:cover;background-position:center;
    cursor:pointer;transition:.2s;min-width:0}
  .mem-row .mem-ph:hover{transform:scale(1.03)}
  /* ====== Dock ====== */
  .dock{height:60px;margin:4px 12px 12px;border-radius:22px;background:rgba(255,255,255,.3);
    backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-around;
    flex-shrink:0;z-index:21}
  .dock .d{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;
    justify-content:center;font-size:20px;background:rgba(255,255,255,.85);cursor:pointer;transition:.15s}
  .dock .d:hover{transform:translateY(-3px)}
  /* ====== 通知 toast ====== */
  .notif{position:absolute;top:44px;left:10px;right:10px;background:rgba(255,255,255,.96);
    backdrop-filter:blur(16px);border-radius:16px;padding:14px;z-index:50;
    box-shadow:0 8px 30px rgba(0,0,0,.18);transform:translateY(-200%);transition:transform .4s cubic-bezier(.22,1,.36,1)}
  .notif.show{transform:translateY(0)}
  .notif-top{display:flex;gap:10px;align-items:flex-start}
  .notif-ico{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#0A59F7,#8A5CF6);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .notif-title{font-size:14px;font-weight:700;color:#1A1A1A}
  .notif-body{font-size:12px;color:#6B6B6B;margin-top:2px;line-height:1.5}
  .notif-ev{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .notif-ev .ev-chip{font-size:10px;background:#F0F4FF;color:#0A59F7;padding:3px 8px;border-radius:10px}
  .notif-actions{display:flex;gap:8px;margin-top:12px}
  .notif-actions button{flex:1;border:none;border-radius:10px;padding:10px;font-size:13px;
    font-weight:600;cursor:pointer;font-family:inherit}
  .notif-create{background:var(--accent);color:#fff}
  .notif-later{background:var(--card-line);color:var(--panel-sub)}
  /* ====== 全程计划应用页（全屏，参考 travel-fork 详情页） ====== */
  .app-page{position:absolute;inset:0;background:#fff;z-index:50;display:none;
    flex-direction:column;animation:apSlide .3s ease}
  .app-page.show{display:flex}
  @keyframes apSlide{from{transform:translateY(24px);opacity:.3}to{transform:translateY(0);opacity:1}}
  .ap-bar{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;
    border-bottom:1px solid var(--card-line);background:#fff;position:relative;z-index:2}
  .ap-back{border:none;background:var(--card-line);width:32px;height:32px;border-radius:50%;
    font-size:22px;cursor:pointer;color:var(--card-text);line-height:1;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:.15s}
  .ap-back:hover{background:#E4E4E4}
  .ap-title{font-size:17px;font-weight:700;color:#1A1A1A}
  .ap-sub{font-size:11px;color:#8A8A8A;margin-top:1px}
  .ap-body{flex:1;overflow-y:auto;padding:16px 18px 28px;position:relative;z-index:1}
  .ap-body::-webkit-scrollbar{width:0}
  /* 顶部概览卡 */
  /* 顶部概览卡（手账风格：3天+起飞时间+双城天气+确认标签） */
  .ap-overview{background:linear-gradient(135deg,#0A59F7,#8A5CF6);color:#fff;border-radius:18px;
    padding:16px 18px;margin-bottom:18px;box-shadow:0 6px 18px rgba(10,89,247,.25);position:relative}
  .ap-overview .ov-goto{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:18px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);
    transition:.15s}
  .ap-overview .ov-goto:hover{background:rgba(255,255,255,.32)}
  .ap-overview .ov-days{font-size:36px;font-weight:800;line-height:1;letter-spacing:-1px}
  .ap-overview .ov-date{font-size:13px;font-weight:600;opacity:.95;margin-top:8px;padding-bottom:12px;
    border-bottom:1px solid rgba(255,255,255,.28)}
  .ap-overview .ov-weather{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.93;margin-top:12px}
  .ap-overview .ov-weather .ov-w-arr{font-size:14px;opacity:.65}
  .ap-overview .ov-tags{display:flex;gap:8px;margin-top:12px}
  .ap-overview .ov-tag{font-size:11px;font-weight:700;background:rgba(255,255,255,.2);
    padding:5px 11px;border-radius:20px}
  .ap-section-label{font-size:12px;font-weight:600;color:#8A8A8A;margin:0 2px 8px;letter-spacing:.3px}
  /* 时间线列表 */
  .tl-list{padding:0}
  .tl-item{display:flex;gap:14px;padding:12px 0;cursor:pointer;transition:.15s;border-radius:12px;padding:12px}
  .tl-item:hover{background:#F5F6FA}
  .tl-node{display:flex;flex-direction:column;align-items:center;flex-shrink:0;padding-top:2px}
  .tl-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:15px;background:#F0F0F0;transition:.2s}
  .tl-line{width:2px;flex:1;min-height:20px;background:#E8E8E8;margin-top:4px}
  .tl-item:last-child .tl-line{display:none}
  .tl-item.done .tl-dot{background:#E8F5E9}
  .tl-item.cur .tl-dot{background:var(--accent);color:#fff;box-shadow:0 0 0 4px rgba(10,89,247,.18);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(10,89,247,.18)}50%{box-shadow:0 0 0 8px rgba(10,89,247,.08)}}
  .tl-content{flex:1;padding-bottom:12px}
  .tl-stage-name{font-size:14px;font-weight:700;color:#1A1A1A;display:flex;align-items:center;gap:8px}
  .tl-stage-name .badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500}
  .tl-stage-name .badge.done{background:#E8F5E9;color:#2E7D32}
  .tl-stage-name .badge.cur{background:#E3F2FD;color:#0A59F7}
  .tl-stage-name .badge.upcoming{background:#F0F0F0;color:#8A8A8A}
  .tl-stage-date{font-size:12px;color:#8A8A8A;margin-top:3px}
  .tl-stage-detail{font-size:12px;color:#6B6B6B;margin-top:4px;line-height:1.5}
  /* ====== 圆周旅记风格应用页 ====== */
  .ap-route-map{background:#F5F6FA;border-radius:16px;padding:10px;margin-bottom:14px;
    border:1px solid var(--card-line)}
  .ap-route-map svg{width:100%;height:auto;display:block}
  .ap-day-tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:1px solid var(--card-line);
    overflow-x:auto;-webkit-overflow-scrolling:touch}
  .ap-day-tabs::-webkit-scrollbar{display:none}
  .ap-day-tab{padding:10px 14px;font-size:13px;font-weight:600;color:#8A8A8A;
    white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;transition:.2s;flex-shrink:0}
  .ap-day-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .ap-day-tab .dt-dist{font-size:10px;font-weight:500;opacity:.7;margin-left:4px}
  .ap-loc-item{display:flex;gap:10px;padding:11px 0;align-items:flex-start}
  .ap-loc-item:not(:last-child){border-bottom:1px solid var(--card-line)}
  .ap-loc-time{flex-shrink:0;width:50px;font-size:12px;font-weight:600;color:#1A1A1A;padding-top:3px}
  .ap-loc-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;font-size:17px;flex-shrink:0}
  .ap-loc-info{flex:1;min-width:0}
  .ap-loc-name{font-size:14px;font-weight:700;color:#1A1A1A}
  .ap-loc-detail{font-size:12px;color:#8A8A8A;margin-top:2px;line-height:1.4}
  .ap-loc-dist{font-size:11px;color:var(--accent);font-weight:500;margin-top:3px;

// ====== 渲染全程计划应用页（圆周旅记风格） ======
const catBg={spot:'#E8F5E9',food:'#FFF3E0',transport:'#E3F2FD',hotel:'#F3E5F5'};
const catFg={spot:'#2E7D32',food:'#E65100',transport:'#0A59F7',hotel:'#7B1FA2'};
const catLabel={spot:'景点',food:'美食',transport:'交通',hotel:'住宿'};

function renderAppPage(){
  const body=document.getElementById('ap-body');
  const overview=`
    <div class="ap-overview">
      <button class="ov-goto" onclick="scrollToRouteMap()">↗</button>
      <div class="ov-days">3天</div>
      <div class="ov-date">8月21日 · 08:45 起</div>
      <div class="ov-weather">
        <span>☁ 昆明 14°C 多云</span>
        <span class="ov-w-arr">→</span>
        <span>📍 大理 18°C 晴</span>
      </div>
      <div class="ov-tags">
        <span class="ov-tag">✓ 机票</span>
        <span class="ov-tag">✓ 酒店</span>
      </div>
    </div>`;

  // 搜索栏 + 分类筛选（查）
  const searchBar=`<div class="ap-search-bar">
    <input class="ap-search-input" type="text" placeholder="搜索地点名称或详情..." value="${searchQuery}" oninput="filterLocs(this.value)">
    <div class="ap-cat-filter">
      <button class="${filterCat==='all'?'active':''}" onclick="filterByCat('all')">全部</button>
      <button class="${filterCat==='spot'?'active':''}" onclick="filterByCat('spot')">景点</button>
      <button class="${filterCat==='food'?'active':''}" onclick="filterByCat('food')">美食</button>
      <button class="${filterCat==='transport'?'active':''}" onclick="filterByCat('transport')">交通</button>
      <button class="${filterCat==='hotel'?'active':''}" onclick="filterByCat('hotel')">住宿</button>
    </div>
  </div>`;

  // 路线地图
  const routeMap=`<div class="ap-route-map">${routeMapSVG()}</div>`;

  // 按天 Tab
  let tabs='<div class="ap-day-tabs">';
  tabs+=`<div class="ap-day-tab ${curDay===0?'active':''}" onclick="switchDayTab(0)">总览</div>`;
  tripDays.forEach((d,i)=>{
    tabs+=`<div class="ap-day-tab ${curDay===i+1?'active':''}" onclick="switchDayTab(${i+1})">${d.label}<span class="dt-dist">${d.dist}</span></div>`;
  });
  tabs+='</div>';

  // 地点列表（可点击 → 半模态弹窗编辑/删除）
  let locHTML='<div class="ap-loc-list">';
  let dayIndices;
  if(curDay===0){
    dayIndices=tripDays.map(function(_,i){return i;});
  }else{
    dayIndices=[curDay-1];
  }
  dayIndices.forEach(function(dayIdx){
    var d=tripDays[dayIdx];
    if(curDay===0){
      locHTML+=`<div style="font-size:11px;font-weight:700;color:#8A8A8A;margin:8px 0 2px;padding-left:2px">${d.label} · ${d.date} · 共${d.dist}</div>`;
    }
    d.locs.forEach(function(l,locIdx){
      if(filterCat!=='all'&&l.cat!==filterCat) return;
      if(searchQuery){
        var q=searchQuery.toLowerCase();
        if(!l.name.toLowerCase().includes(q)&&!(l.detail&&l.detail.toLowerCase().includes(q))) return;
      }
      var cb=catBg[l.cat]||'#F0F0F0';
      var cf=catFg[l.cat]||'#8E8E93';
      locHTML+=`
      <div class="ap-loc-item" onclick="openLocModal(${dayIdx},${locIdx})">
        <div class="ap-loc-time">${l.time}</div>
        <div class="ap-loc-ico" style="background:${cb}">${l.ico}</div>
        <div class="ap-loc-info">
          <div class="ap-loc-name">${l.name}</div>
          <div class="ap-loc-detail">${l.detail}</div>
          ${l.dist?`<div class="ap-loc-dist" style="color:${cf}">📍 ${l.dist}</div>`:''}
        </div>
        <div class="ap-loc-cat" style="background:${cb};color:${cf}">${catLabel[l.cat]}</div>
      </div>`;
    });
  });
  locHTML+='</div>';

  // 半模态弹窗
  var modalHTML='';
  if(modalLoc){
    var ml=modalLoc.mode==='add'
      ?{name:'',time:'',detail:'',cat:'spot',ico:'📍',dist:''}
      :tripDays[modalLoc.dayIdx].locs[modalLoc.locIdx];
    var mcb=catBg[ml.cat]||'#F0F0F0';
    var mcf=catFg[ml.cat]||'#8E8E93';
    modalHTML=`<div class="ap-modal-mask show" onclick="closeLocModal()"></div>
    <div class="ap-modal-sheet show">
      <div class="ap-modal-handle"></div>
      <button class="ap-modal-close" onclick="closeLocModal()">✕</button>`;
    if(modalLoc.mode==='view'){
      modalHTML+=`
        <div class="ap-modal-title">${ml.name}</div>
        <div class="ap-modal-sub">${ml.time||'未设置时间'} · ${catLabel[ml.cat]||'地点'}</div>
        ${ml.detail?`<div style="font-size:13px;color:#6B6B6B;text-align:center;margin-bottom:14px;line-height:1.5">${ml.detail}</div>`:''}
        ${ml.dist?`<div style="font-size:12px;color:${mcf};text-align:center;margin-bottom:14px">📍 ${ml.dist}</div>`:''}
        <div class="ap-modal-actions">
          <button class="ma-btn ma-edit" onclick="setModalMode('edit')">✏️ 编辑</button>
          <button class="ma-btn ma-del" onclick="confirmDeleteLoc()">🗑️ 删除</button>
        </div>`;
    }else{
      var saveFn=modalLoc.mode==='edit'?'saveModalEdit':'saveModalAdd';
      modalHTML+=editFormHTML(ml,modalLoc.mode,saveFn,'closeLocModal');
    }
    modalHTML+=`</div>`;
  }

  // 可拖动浮动按钮（独立于 ap-body，挂在 app-page 上）
  var fabHTML=`<button class="ap-fab" id="apFab" onclick="if(!fabDragged)openLocModal(-1,-1)">+</button>`;

  body.innerHTML=overview+searchBar+routeMap+tabs+locHTML+modalHTML;

  // FAB 挂到 app-page 上（不被 ap-body 的 overflow 影响）
  var appPage=document.querySelector('.app-page');
  var oldFab=document.getElementById('apFab');
  if(oldFab) oldFab.remove();
  if(appPage) appPage.insertAdjacentHTML('beforeend',fabHTML);

  // 初始化FAB拖拽
  initFabDrag();
}

// ====== CRUD: 半模态弹窗 + 可拖动FAB ======
const catIcons={spot:'\u{1F3DB}\u{FE0F}',food:'\u{1F35C}',transport:'\u2708\u{FE0F}',hotel:'\u{1F3E8}'};

function filterLocs(q){searchQuery=q;renderAppPage();}
function filterByCat(cat){filterCat=cat;renderAppPage();}

// 打开半模态弹窗：查看/编辑/添加
function openLocModal(di,li){
  if(di===-1){
    // FAB添加：定位到当前选中的天
    var dayIdx=curDay===0?0:curDay-1;
    modalLoc={dayIdx:dayIdx,locIdx:-1,mode:'add'};
  }else{
    modalLoc={dayIdx:di,locIdx:li,mode:'view'};
  }
  renderAppPage();
}
function closeLocModal(){modalLoc=null;renderAppPage();}
function setModalMode(m){if(modalLoc){modalLoc.mode=m;renderAppPage();}}

// 确认删除
function confirmDeleteLoc(){
  if(!modalLoc)return;
  var di=modalLoc.dayIdx,li=modalLoc.locIdx;
  var name=tripDays[di].locs[li].name;
  if(confirm('确定删除「'+name+'」？')){
    tripDays[di].locs.splice(li,1);
    modalLoc=null;
    renderAppPage();
  }
}

// 保存编辑
function saveModalEdit(){
  if(!modalLoc)return;
  var f=document.querySelector('.ap-edit-form.editing');
  if(!f)return;
  var name=f.querySelector('.ef-name').value.trim();
  if(!name){modalLoc=null;renderAppPage();return;}
  var di=modalLoc.dayIdx,li=modalLoc.locIdx;
  var cat=f.querySelector('.ef-cat').value;
  tripDays[di].locs[li].name=name;
  tripDays[di].locs[li].time=f.querySelector('.ef-time').value.trim();
  tripDays[di].locs[li].detail=f.querySelector('.ef-detail').value.trim();
  tripDays[di].locs[li].cat=cat;
  tripDays[di].locs[li].ico=catIcons[cat]||'\u{1F4CD}';
  modalLoc=null;
  renderAppPage();
}

// 保存添加
function saveModalAdd(){
  if(!modalLoc)return;
  var f=document.querySelector('.ap-edit-form.adding');
  if(!f)return;
  var name=f.querySelector('.ef-name').value.trim();
  if(!name){modalLoc=null;renderAppPage();return;}
  var di=modalLoc.dayIdx;
  var cat=f.querySelector('.ef-cat').value;
  tripDays[di].locs.push({
    cat:cat,ico:catIcons[cat]||'\u{1F4CD}',name:name,
    time:f.querySelector('.ef-time').value.trim(),
    detail:f.querySelector('.ef-detail').value.trim(),dist:''
  });
  modalLoc=null;
  renderAppPage();
}

function editFormHTML(loc,formClass,saveFn,cancelFn){
  var h='<div class="ap-edit-form '+formClass+'">';
  h+='<div class="ef-row">';

  h+='<input class="ef-time" type="text" value="'+(loc.time||'')+'" placeholder="时间">';
  h+='</div>';
  h+='<div class="ef-row">';

// ====== 可拖动浮动按钮 ======
var fabDragged=false;
function initFabDrag(){
  var fab=document.getElementById('apFab');
  if(!fab)return;
  var startX=0,startY=0,origX=0,origY=0,moved=false;
  fab.addEventListener('pointerdown',function(e){
    startX=e.clientX;startY=e.clientY;
    var rect=fab.getBoundingClientRect();
    var parent=(fab.offsetParent||document.body).getBoundingClientRect();
    origX=rect.left-parent.left;
    origY=rect.top-parent.top;
    moved=false;
    fabDragged=false;
    fab.setPointerCapture(e.pointerId);
    fab.classList.add('dragging');
    fab.style.transition='none';
    e.preventDefault();
  });
  fab.addEventListener('pointermove',function(e){
    var dx=e.clientX-startX;
    var dy=e.clientY-startY;
    if(Math.abs(dx)>4||Math.abs(dy)>4){moved=true;fabDragged=true;}
    if(moved){
      fab.style.left=origX+dx+'px';
      fab.style.top=origY+dy+'px';
      fab.style.right='auto';
      fab.style.bottom='auto';
    }
  });
  fab.addEventListener('pointerup',function(e){
    fab.releasePointerCapture(e.pointerId);
    fab.classList.remove('dragging');
    fab.style.transition='';
    if(fabDragged){
      setTimeout(function(){fabDragged=false;},50);
    }
  });
  fab.addEventListener('pointercancel',function(){
    fab.classList.remove('dragging');
    fab.style.transition='';
  });
}

// ====== 阶段切换 ======
function switchStage(n){
  if(n===curStage) return;
  const card=document.getElementById('travel-card');
  card.classList.add('fade-out');
  setTimeout(()=>{
    curStage=n;
    renderCard();
    card.classList.remove('fade-out');
    updateUI();
    closeAppPage();
  },250);
}

// ====== 应用页开关 ======
function openAppPage(){
  renderAppPage();
  document.getElementById('app-page').classList.add('show');
}
function closeAppPage(){
  document.getElementById('app-page').classList.remove('show');
}

// ====== 入口路径切换 ======
function switchPath(path){
  curPath=path;
  const notif=document.getElementById('notif');
  const card=document.getElementById('travel-card');
  const badge=document.getElementById('xiaoyi-badge');

  if(path==='passive'){
    card.style.opacity='0';
    card.style.pointerEvents='none';
    setTimeout(()=>notif.classList.add('show'),300);
  } else {
    notif.classList.remove('show');
    card.style.opacity='';
    card.style.pointerEvents='';
    badge.classList.add('show');
    setTimeout(()=>badge.classList.remove('show'),2500);
  }
  document.querySelectorAll('#path-btns button').forEach(b=>{
    b.classList.toggle('on',b.dataset.path===path);
  });
}

// ====== 被动识别：创建卡片 ======
function createCard(){
  const notif=document.getElementById('notif');
  const card=document.getElementById('travel-card');
  notif.classList.remove('show');
  setTimeout(()=>{
    card.style.opacity='';
    card.style.pointerEvents='';
    card.style.animation='none';
    void card.offsetWidth;
    card.style.animation='cardIn .4s ease';
  },300);
}

function dismissNotif(){
  document.getElementById('notif').classList.remove('show');
}

// ====== 更新控制台信息 ======
function updateUI(){
  const s=stages[curStage];
  document.querySelectorAll('#stage-btns button').forEach(b=>{
    b.classList.toggle('on',parseInt(b.dataset.stage)===curStage);
  });
  document.getElementById('stage-info').innerHTML=`
    <b>${s.icon} ${s.name}</b><br>
    ${s.desc}<br>
    <span class="si-signal">→ ${s.signal}</span>`;
}

// ====== 时钟 ======
function updateClock(){
  const d=new Date();
  const h=d.getHours();
  const m=String(d.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent=`${h}:${m}`;
  const tc=document.getElementById('tc-clock');
  if(tc) tc.textContent=`${h}:${m}`;
}

// ====== 事件绑定 ======
document.getElementById('stage-btns').addEventListener('click',e=>{
  if(e.target.tagName==='BUTTON') switchStage(parseInt(e.target.dataset.stage));
});
document.getElementById('path-btns').addEventListener('click',e=>{
  if(e.target.tagName==='BUTTON') switchPath(e.target.dataset.path);
});

// ====== 初始化 ======
fillAppIcons();
// 支持 URL hash 自动选阶段（如 #stage=3），方便截图和分享
const hashMatch=location.hash.match(/stage=(\d)/);
if(hashMatch){curStage=parseInt(hashMatch[1]);}
renderCard();
updateUI();
// 支持 URL hash 自动打开全程计划应用页（如 #app=1），方便截图和分享
if(location.hash.includes('app=1')) openAppPage();
updateClock();
setInterval(updateClock,30000);
</script>
